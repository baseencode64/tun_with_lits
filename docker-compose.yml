version: "3.8"

services:
  goxray:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETOS: linux
        TARGETARCH: amd64

    image: goxray:latest
    container_name: goxray-vpn

    # Privileged mode required for TUN device and iptables
    privileged: true

    # Network mode: host allows direct access to host network interfaces
    # Required for VPN functionality
    # NOTE: If you need SOCKS5 proxy accessible from other containers,
    # comment out network_mode: host and uncomment ports section below
    network_mode: host

    # Ports (uncomment if not using host network mode)
    # ports:
    #   - "1080:1080"  # SOCKS5 proxy
    #   - "9090:9090"  # Prometheus metrics

    # Capabilities required for VPN operations
    cap_add:
      - NET_ADMIN # Required for TUN device creation and routing
      - NET_RAW # Required for raw socket operations
      - NET_BIND_SERVICE # Required for binding to privileged ports

    # Devices
    devices:
      - /dev/net/tun:/dev/net/tun # TUN device for VPN tunnel

    # Volumes
    volumes:
      # Configuration file
      - ./config.yaml:/etc/goxray/config.yaml:ro

      # Logs directory (optional)
      - ./logs:/var/log/goxray

      # Persistent state (optional)
      - goxray-data:/var/lib/goxray

    # Environment variables (can be overridden in .env file)
    environment:
      # Log level: debug, info, warn, error
      - LOG_LEVEL=${LOG_LEVEL:-info}

      # Log format: text, json
      - LOG_FORMAT=${LOG_FORMAT:-text}

      # Metrics port (0 = disabled)
      - METRICS_PORT=${METRICS_PORT:-9090}

      # Enable IPv6 support
      - ENABLE_IPV6=${ENABLE_IPV6:-false}

      # Enable DNS protection
      - ENABLE_DNS_PROTECTION=${ENABLE_DNS_PROTECTION:-true}

      # Enable kill switch
      - ENABLE_KILL_SWITCH=${ENABLE_KILL_SWITCH:-true}

      # Split tunneling enabled
      - SPLIT_TUNNEL_ENABLED=${SPLIT_TUNNEL_ENABLED:-false}

      # Split tunneling mode: exclude, include, disabled
      - SPLIT_TUNNEL_MODE=${SPLIT_TUNNEL_MODE:-exclude}

      # SOCKS5 proxy enabled
      - SOCKS5_ENABLED=${SOCKS5_ENABLED:-false}

      # SOCKS5 listen address
      - SOCKS5_LISTEN_ADDR=${SOCKS5_LISTEN_ADDR:-0.0.0.0:1080}

    # Command: run with config file
    command: ["--config", "/etc/goxray/config.yaml"]

    # Restart policy
    restart: unless-stopped

    # Health check
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:${METRICS_PORT:-9090}/metrics",
          "||",
          "exit",
          "1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Labels
    labels:
      com.goxray.description: "GoXRay VPN Client with Split Tunneling and SOCKS5 Proxy"
      com.goxray.version: "1.7.0"
      com.goxray.vendor: "GoXRay Project"
      com.goxray.features: "vpn,split-tunneling,socks5,kill-switch,dns-protection"

# Volumes
volumes:
  goxray-data:
    driver: local
    labels:
      com.goxray.description: "GoXRay persistent data"

# Networks (not used due to host network mode, but defined for reference)
networks:
  default:
    driver: bridge
